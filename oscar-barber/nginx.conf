server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy /pb/ → PocketBase API
    location /pb/ {
        proxy_pass         http://pocketbase:8090/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
